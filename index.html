<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>용돈 받아라 - 생활습관·경제교육</title>
<meta name="description" content="좋은 습관을 실천하면 용돈이 쌓여요. 벌고, 쓰고, 저축하며 배우는 우리 자녀 생활습관·경제교육 앱">
<meta name="theme-color" content="#FF9F43">
<script>
  /* 카카오톡 안의 브라우저로 열리면 기록이 카톡 안에만 저장되고 앱 설치도 안 돼서, 크롬(기본 브라우저)으로 다시 열기 */
  (function(){
    var ua=navigator.userAgent||'';
    if(/KAKAOTALK/i.test(ua)){
      location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(location.href);
    }
  })();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  @font-face{font-family:'Jua';src:url(fonts/Jua-Regular.ttf) format('truetype');font-display:swap}
  :root{
    --bg:#FFF8EC; --card:#fff; --ink:#3B2F2A; --sub:#8A7B72; --line:#F0E4D3;
    --main:#FF9F43; --main-d:#E8842A; --green:#2EB872; --red:#E8505B; --blue:#4D96FF;
    --soft:#FFF1DC;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;
    word-break:keep-all;overflow-wrap:anywhere}
  .wrap{max-width:560px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px 96px}
  .tagline{text-align:center;color:var(--sub);font-size:13px;margin:-8px 0 14px}
  h1{font-family:'Jua',sans-serif;font-weight:400;font-size:26px;margin:4px 0 12px;text-align:center}
  /* 앱을 쓰는 중(하단 탭이 보일 때)에는 머리글을 작게, 한 줄 소개는 숨김 */
  body:has(#tabs:not(.hide)) h1{font-size:19px;margin:0 0 10px;color:var(--main-d)}
  body:has(#tabs:not(.hide)) .tagline{display:none}
  .jua{font-family:'Jua',sans-serif;font-weight:400}
  .kids{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
  .kid{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-size:16px;cursor:pointer;color:var(--ink)}
  .kid.on{border-color:var(--main);background:var(--main);color:#fff;font-weight:700}
  .card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 0 var(--line)}
  .bal-label{color:var(--sub);font-size:13px}
  .bal{font-family:'Jua',sans-serif;font-size:40px;color:var(--main-d);line-height:1.2}
  .bal.minus{color:var(--red)}
  .balcard .bal{font-size:34px}
  .spendbtn{flex:0 0 auto;margin-bottom:6px}
  .goalmini{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px}
  .goalmini span{flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
  .goalmini .bar{flex:1;margin:0;height:8px}
  .goalmini b{color:var(--blue);font-size:13px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .muted{color:var(--sub);font-size:13px}
  .bar{height:12px;background:var(--soft);border-radius:99px;overflow:hidden;margin:8px 0 4px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#8FD3FF,var(--blue));border-radius:99px;transition:width .4s}
  .btn{border:0;border-radius:12px;padding:10px 16px;font-size:15px;font-weight:700;cursor:pointer;background:var(--main);color:#fff;font-family:inherit}
  .btn:disabled{opacity:.5}
  .btn.ghost{background:var(--soft);color:var(--ink)}
  .btn.red{background:var(--red)}
  .btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
  .btn.full{width:100%;margin-top:10px}
  .mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .mini div{background:var(--soft);border-radius:12px;padding:8px 10px;min-width:0}
  .mini b{font-family:'Jua',sans-serif;font-weight:400;font-size:18px;display:block}
  .datenav{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0 12px}
  .datenav .d{font-family:'Jua',sans-serif;font-size:20px;min-width:150px;text-align:center}
  .nav{width:40px;height:40px;border-radius:50%;border:0;background:#fff;font-size:18px;box-shadow:0 2px 0 var(--line);cursor:pointer;color:var(--ink)}
  .nav:disabled{opacity:.3}
  .sec{font-family:'Jua',sans-serif;font-size:18px;margin:16px 4px 8px}
  .item{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:8px;border:2px solid transparent}
  .item.some{border-color:#BDEBD2}
  .item.full{border-color:var(--green);background:#F0FBF5}
  .item.fine{background:#FFF5F5}
  .item.fine.some,.item.fine.full{border-color:#F5B5BA;background:#FFF0F0}
  .item.fine .box.on{background:var(--red);border-color:var(--red)}
  .item.fine .amt{color:var(--red)}
  .item.busy{opacity:.5;pointer-events:none}
  .item .n{font-weight:700;font-size:16px}
  .item .m{color:var(--sub);font-size:12px;margin-top:2px}
  .boxes{display:flex;align-items:center;gap:8px;margin-top:10px}
  .box{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:22px;color:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:0 0 auto}
  .box.on{background:var(--green);border-color:var(--green)}
  .boxes .info{margin-left:auto;text-align:right}
  .amt{font-family:'Jua',sans-serif;font-size:18px;color:var(--main-d);white-space:nowrap}
  .amt.zero,.item.fine .amt.zero{color:#C9BBAE}
  .boxes .info .muted{white-space:nowrap}
  .tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;display:flex;border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);z-index:10}
  .tab{flex:1;border:0;background:none;padding:10px 0 12px;font-size:13px;color:var(--sub);cursor:pointer;font-family:inherit}
  .tab b{display:block;font-size:22px}
  .tab.on{color:var(--main-d);font-weight:700}
  .line{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px dashed var(--line)}
  .line:last-child{border-bottom:0}
  .line .l{min-width:0;flex:1}
  .line .names{color:var(--sub);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .weekhead{font-family:'Jua',sans-serif;font-size:15px;color:var(--main-d);margin:8px 2px 2px}
  .weekpage{min-height:120px}
  .pager{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:10px;flex-wrap:wrap}
  .pg{border:1px solid var(--line);background:#fff;border-radius:99px;min-width:34px;height:34px;padding:0 10px;font-size:13px;color:var(--ink);cursor:pointer;font-family:inherit}
  .pg:disabled{opacity:.3}
  .pg.num.empty{color:#C9BBAE}
  .pg.num.on{background:var(--main);border-color:var(--main);color:#fff;font-weight:700}
  .in{color:var(--green);font-weight:700}
  .out{color:var(--red);font-weight:700}
  .r{text-align:right;white-space:nowrap}
  .badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;background:var(--soft);margin-right:4px}
  .badge.need{background:#E4F6EC;color:#1E8A52}
  .badge.want{background:#FDEBEC;color:#B23A48}
  .badge.off{background:#eee;color:#999}
  .bonus{color:#C77700;font-weight:700}
  .save{color:var(--blue);font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
  .chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--ink);font-family:inherit}
  .chips button.on{background:var(--soft);border-color:var(--main);font-weight:700}
  .bcard{background:#FFF9E8;border:2px dashed #FFD27A;border-radius:16px;padding:12px 14px;margin-top:4px}
  .del{border:0;background:none;color:var(--sub);font-size:12px;text-decoration:underline;cursor:pointer;padding:2px 0;font-family:inherit}
  .mitem{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .mitem:last-child{border-bottom:0}
  .mitem .t{flex:1;min-width:0}
  .mitem.off{opacity:.5}
  .mitem.tap{cursor:pointer}
  .mitem.tap:active{background:var(--soft)}
  .chev{color:#C9BBAE;font-size:22px;line-height:1;flex:0 0 auto}
  .kchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .kchip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--ink);font-family:inherit}
  .linkdel{display:block;margin:14px auto 0;border:0;background:none;color:var(--red);font-size:13px;text-decoration:underline;cursor:pointer;font-family:inherit}
  /* 설정 목록 */
  .list{background:var(--card);border-radius:18px;margin-bottom:12px;box-shadow:0 2px 0 var(--line);overflow:hidden}
  .list .lrow{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:none;
    font-size:15px;color:var(--ink);text-align:left;cursor:pointer;font-family:inherit;text-decoration:none}
  .list .lrow:last-child{border-bottom:0}
  .list .lrow:active{background:var(--soft)}
  .lrow .li{font-size:20px;flex:0 0 26px;text-align:center}
  .lrow .lt{flex:1;min-width:0}
  .lrow .lv{color:var(--sub);font-size:13px;white-space:nowrap}
  .lhead{font-size:13px;color:var(--sub);margin:16px 6px 6px}
  .dangerlink{display:block;margin:18px auto 6px;border:0;background:none;color:var(--red);font-size:13px;cursor:pointer;font-family:inherit;text-decoration:underline}
  label.f{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
  input,select,textarea{width:100%;font-size:16px;padding:10px;border:2px solid var(--line);border-radius:10px;background:#fff;font-family:inherit;color:var(--ink)}
  textarea{resize:vertical;min-height:60px}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;padding:10px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:15px;cursor:pointer;color:var(--ink);font-family:inherit}
  .seg button.on{border-color:var(--main);background:var(--soft);font-weight:700}
  .ck{display:flex;align-items:center;gap:8px;margin-top:12px}
  .ck input{width:20px;height:20px}
  .modal{position:fixed;inset:0;background:rgba(40,30,20,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .modal.on{display:flex}
  .sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
  .sheet h3{font-family:'Jua',sans-serif;font-weight:400;font-size:21px;margin:0 0 6px}
  .toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-140px);background:var(--ink);color:#fff;
    padding:12px 18px;border-radius:14px;font-weight:700;z-index:60;transition:transform .3s;max-width:calc(100vw - 32px);text-align:center}
  .toast.on{transform:translateX(-50%) translateY(env(safe-area-inset-top))}
  .loading{text-align:center;color:var(--sub);padding:30px}
  .est{display:flex;justify-content:space-between;gap:8px;padding:6px 0}
  .warn{background:#FFF0F0;color:#B23A48;border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0}
  .tip{background:#EEF6FF;border-radius:12px;padding:10px 12px;font-size:13px;color:#2D5B9A;margin-top:10px}
  .hide{display:none!important}
  .demobar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#EEF6FF;color:#2D5B9A;
    border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:12px}
  .demobar .btn{flex:0 0 auto;background:var(--blue)}
  .demobar.big{padding:12px 12px 12px 14px;border:2px solid #CFE2FF;gap:10px}
  .demobar.big .dico{font-size:30px;line-height:1;flex:0 0 auto}
  .demobar.big .dtxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .demobar.big .dtxt b{font-size:17px;line-height:1.3}
  .demobar.big .dtxt span{font-size:14px;opacity:.85}
  .demobar.big .btn{font-size:15px;padding:10px 14px;line-height:1.3;border-radius:14px;text-align:center}
  /* 플러스 */
  .jars{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
  .jar{border-radius:12px;padding:8px;text-align:center;font-size:12px;min-width:0}
  .jar span{display:block;color:var(--sub)} .jar small{font-size:10px}
  .jar b{display:block;font-family:'Jua',sans-serif;font-weight:400;font-size:17px;margin-top:2px}
  .jar.spend{background:#FFF1DC} .jar.save{background:#E6F0FF} .jar.give{background:#FDEBF3}
  .bankline{background:#EEF4FF;border-radius:12px;padding:8px 10px;margin-top:10px;font-size:13px;color:#2D5B9A}
  .plusstar{font-size:.85em}
  .emopick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .emopick button{font-size:26px;padding:6px 0;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
  .emopick button.on{border-color:var(--main);background:var(--soft)}
  .actrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-top:12px}
  .act{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border:0;border-radius:14px;cursor:pointer;font-family:inherit;
    font-size:13px;font-weight:700;color:#fff;background:var(--c)}
  .act b{font-size:20px;line-height:1.2}
  .act:active{filter:brightness(.92)}
  body.withad .wrap{padding-bottom:170px} /* 앱 광고 배너가 내용을 가리지 않게 */
  .setupcard .kidrow input{font-size:17px;padding:12px}
  .btn.big{font-size:18px;padding:14px;border-radius:14px}
  .ver{color:#C9BBAE;font-size:12px;text-align:center;margin-top:14px}
  /* 더보기 아이콘 모음 */
  .moregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .mtile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:104px;padding:12px 6px;
    background:var(--card);border:0;border-radius:18px;box-shadow:0 2px 0 var(--line);cursor:pointer;font-family:inherit;color:var(--ink)}
  .mtile:active{background:var(--soft)}
  .mico{font-size:30px;line-height:1.1}
  .mlab{font-size:14px;font-weight:700;text-align:center;line-height:1.3}
  .msub{font-size:11px;color:var(--main-d);background:var(--soft);border-radius:99px;padding:1px 8px}
  details.fold{background:var(--card);border-radius:18px;margin-bottom:12px;box-shadow:0 2px 0 var(--line)}
  details.fold summary{list-style:none;cursor:pointer;padding:14px 16px;font-family:'Jua',sans-serif;font-size:17px;display:flex;justify-content:space-between;align-items:center}
  details.fold summary::-webkit-details-marker{display:none}
  details.fold summary::after{content:'펼치기 ›';font-family:inherit;font-size:12px;color:var(--sub)}
  details.fold[open] summary::after{content:'접기 ‹'}
  details.fold .fbody{padding:0 16px 14px}
  .plustag{display:inline-block;font-size:11px;background:#F1EAFF;color:#7C5CE0;border-radius:99px;padding:1px 7px;margin-left:4px;vertical-align:middle}
  .pluscard{background:linear-gradient(135deg,#F3EEFF,#FFF1DC);border:2px solid #E3D6FF;border-radius:18px;padding:14px 16px;margin-bottom:12px;cursor:pointer}
  .promo{display:inline-block;margin-top:8px;background:#7C5CE0;color:#fff;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700}
  .promo.big{display:block;text-align:center;font-size:14px;padding:8px;margin-top:14px}
  .plushero{background:linear-gradient(135deg,#F3EEFF,#FFF1DC);border-radius:16px;padding:14px;margin-bottom:10px}
  .pfeat{display:flex;gap:10px;padding:8px 2px;border-bottom:1px dashed var(--line)}
  .pfeat .pico{font-size:26px;flex:0 0 34px;text-align:center}
  .plusbox{background:#F7F3FF;border:1px solid #E3D6FF;border-radius:14px;padding:10px 12px;margin-top:14px}
  .seg button small{font-size:11px;color:var(--sub)}
  canvas.sign{width:100%;height:96px;border:2px dashed var(--line);border-radius:10px;background:#fff;touch-action:none}
  .contract{background:#FFFDF7;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.6}
  .contract ul{margin:4px 0 8px;padding-left:20px}
  .ctitle{font-family:'Jua',sans-serif;font-size:24px;text-align:center;margin-bottom:6px}
  .csec{font-weight:700;margin-top:8px}
  .csigns{display:flex;gap:16px;margin-top:10px}.csigns>div{flex:1;text-align:center}
  .csigns img{width:100%;max-height:90px;object-fit:contain}.sline{display:block;border-bottom:1px solid #999;height:60px}
  .album{background:linear-gradient(160deg,#FFF8EC,#F3EEFF);border-radius:18px;padding:16px;border:2px solid #E3D6FF}
  .ahead{display:flex;gap:12px;align-items:center}.aemoji{font-size:44px}
  .agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .astat{background:#fff;border-radius:12px;padding:8px 4px;text-align:center}
  .aico{font-size:20px}.aval{font-family:'Jua',sans-serif;font-size:16px}.alab{font-size:11px;color:var(--sub)}
  .atop{background:#fff;border-radius:12px;padding:10px 12px;margin-top:10px}
  .amsg{margin-top:12px;text-align:center;font-family:'Jua',sans-serif;font-size:17px;color:#7C5CE0}
  #printArea{display:none}
  @media print{
    body>*:not(#printArea){display:none!important}
    #printArea{display:block!important}
    .contract.print{border:0;font-size:15px}
    .album{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
  /* 자녀 참여 */
  .kidhead{background:linear-gradient(160deg,#FFF1DC,#E6F7EE)}
  .kidnote{background:#FFF5F5;border:1px solid #F5B5BA}
  .pendbar{background:#7C5CE0;color:#fff;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-weight:700;cursor:pointer}
  .reqcard{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0}
  .reqimg{width:100%;max-height:320px;object-fit:contain;border-radius:10px;background:#f6f6f6;margin:8px 0}
  .photobtn{display:block;text-align:center;border:2px dashed var(--green);border-radius:14px;padding:16px;margin-top:10px;font-weight:700;color:var(--green);cursor:pointer}
  .photobtn input{display:none}
  .didprev{width:100%;max-height:260px;object-fit:contain;border-radius:12px;margin-top:8px}
  .gmark{display:inline-block;width:20px;height:20px;line-height:20px;border-radius:50%;background:#4285F4;color:#fff;font-weight:700;font-size:13px;margin-right:6px;vertical-align:middle}
  .sharecard{background:#EAF8F0;border:2px solid #BDEBD2;border-radius:16px;padding:14px;margin-top:16px}
  .code{font-family:'Jua',sans-serif;font-size:32px;letter-spacing:3px;text-align:center;background:var(--soft);border-radius:14px;padding:10px;margin:10px 0}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:#bbb;vertical-align:middle}
  .dot.online{background:var(--green)} .dot.connecting{background:#FFB020} .dot.offline{background:#bbb} .dot.error{background:var(--red)}
  .codein{text-align:center;font-size:22px;letter-spacing:3px;text-transform:uppercase}
  .kidrow{display:flex;gap:8px;margin-top:8px}
  .kidrow input{flex:1}
  .center{text-align:center}
  a{color:var(--blue)}
</style>
</head>
<body>
<div class="wrap">
